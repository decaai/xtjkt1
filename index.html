<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X TJKT 1 | SMKN 1 PRACIMANTORO</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg));
        }

        /* --- MODERN HEADER --- */
        header {
            text-align: center;
            padding: 4rem 1rem;
            animation: fadeIn 1s ease-out;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        /* --- STUDENT GRID --- */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .student-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .student-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* --- MINI GAME: CATCH THE STUDENT --- */
        .game-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            border: 2px solid var(--accent);
            position: relative;
            overflow: hidden;
        }

        #game-canvas {
            width: 100%;
            height: 300px;
            background: #020617;
            border-radius: 12px;
            margin: 20px 0;
            position: relative;
            cursor: crosshair;
        }

        .target {
            position: absolute;
            padding: 8px 15px;
            background: var(--accent);
            border-radius: 20px;
            color: white;
            font-weight: bold;
            user-select: none;
            transition: 0.1s;
            box-shadow: 0 0 15px var(--accent);
        }

        .btn-play {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-play:hover { opacity: 0.8; transform: scale(1.05); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<header>
    <h1>X TJKT 1</h1>
    <p style="color: var(--text-muted)">SMKN 1 PRACIMANTORO • Future Network Engineer</p>
</header>

<div class="container">
    <div class="student-grid">
        <div class="student-card">
            <div style="font-size: 2rem; margin-bottom: 10px;">👨‍💻</div>
            <h3>Andi Prasetyo</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted)">Network Specialist</p>
        </div>
        <div class="student-card">
            <div style="font-size: 2rem; margin-bottom: 10px;">👩‍💻</div>
            <h3>Siti Sarah</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted)">System Admin</p>
        </div>
        <div class="student-card">
            <div style="font-size: 2rem; margin-bottom: 10px;">👨‍💻</div>
            <h3>Budi Utomo</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted)">Security Analyst</p>
        </div>
    </div>

    <div class="game-section">
        <h2>🎮 Mini Game: Tangkap Siswa!</h2>
        <p>Klik nama siswa yang muncul untuk dapat poin!</p>
        <div style="margin-top: 10px; font-weight: bold;">Skor: <span id="score">0</span></div>
        <div id="game-canvas">
            </div>
        <button class="btn-play" onclick="startGame()">Mulai Main</button>
    </div>
</div>

<script>
    const studentNames = ["Andi", "Siti", "Budi", "Rudi", "Lina", "Dewi"];
    let score = 0;
    let gameActive = false;

    function startGame() {
        if(gameActive) return;
        gameActive = true;
        score = 0;
        document.getElementById('score').innerText = score;
        spawnTarget();
        
        setTimeout(() => {
            gameActive = false;
            alert("Game Selesai! Skor Akhir Kamu: " + score);
            document.getElementById('game-canvas').innerHTML = "";
        }, 15000); // Main selama 15 detik
    }

    function spawnTarget() {
        if(!gameActive) return;

        const canvas = document.getElementById('game-canvas');
        canvas.innerHTML = "";

        const target = document.createElement('div');
        target.className = 'target';
        target.innerText = studentNames[Math.floor(Math.random() * studentNames.length)];
        
        // Posisi Acak
        const maxX = canvas.clientWidth - 100;
        const maxY = canvas.clientHeight - 40;
        target.style.left = Math.floor(Math.random() * maxX) + 'px';
        target.style.top = Math.floor(Math.random() * maxY) + 'px';

        target.onclick = () => {
            score++;
            document.getElementById('score').innerText = score;
            spawnTarget();
        };

        canvas.appendChild(target);

        // Target hilang sendiri kalau tidak diklik dalam 1 detik
        setTimeout(() => {
            if(target.parentElement) spawnTarget();
        }, 1000);
    }
</script>

</body>
</html>
